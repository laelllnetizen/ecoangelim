<!DOCTYPE html>
<html lang="pt-BR">

<script type="module">
    import { auth } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        console.log("Usuário autenticado:", user.email);
      }
    });
</script>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa da Cidade | EcoAngelim</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mapa.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
</head>

<body>

  <!-- ' APP ' -->
  <div class="app">

    <!-- ' HEADER ' -->
    <header class="app-header">

      <!-- ' LOGO ' -->
      <a href="index.html" class="brand" aria-label="EcoAngelim">
        <img src="img/logo.png" alt="EcoAngelim">
      </a>

      <!-- ' ECOCOINS ' -->
      <div class="ecocoins" aria-label="Saldo de EcoCoins">
        <span class="coin-icon">🪙</span>
        <strong id="ecocoins">--</strong>
      </div>

      <!-- ' NOVIDADES ' -->
      <a class="header-action" aria-label="Novidades">
        <span>✉</span>
        <i class="notification-dot"></i>
      </a>

    </header>

    <!-- ' CONTEÚDO ' -->
    <main class="main-content">

      <!-- ' TÍTULO ' -->
      <section class="page-heading">
        <div>
          <span class="eyebrow">EXPLORAR</span>
          <h1>Mapa da Cidade</h1>
        </div>

        <div class="city-status">
          <span class="status-dot"></span>
          Angelim
        </div>
      </section>

      <!-- ' MAPA ' -->
      <section class="map-container">
        <!-- ' CONTROLES SUPERIORES ' -->
        <div class="map-top-controls">
          <button class="map-control" id="fullscreen" aria-label="Tela cheia">
            ⛶
          </button>
        </div>

        <!-- ' MAPA ' -->
        <div id="mapa"></div>
      </section>

      <!-- ' PAINEL DA REGIÃO ' -->
      <div id="painel-regiao" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <strong>Informações da região</strong>
          <button id="fecharSheet" aria-label="Fechar">
            ✕
          </button>
        </div>
        <div id="conteudo-regiao"></div>
      </div>

    </main>

    <!-- ' BOTTOM NAVIGATION ' -->
    <nav class="bottom-nav" aria-label="Navegação principal">

      <!-- ' HOME ' -->
      <a href="index.html" class="nav-item active">
        <span class="nav-icon">⌂</span>
        <span class="nav-label">Início</span>
      </a>

      <!-- ' TICKET / FEIRA COM SUBMENU ' -->
      <div class="nav-item-wrapper">
        <a href="#" class="nav-item" id="btnFeira" aria-expanded="false">
          <span class="nav-icon">🎟</span>
          <span class="nav-label">Feira</span>
        </a>

        <!-- ' SUBMENU FEIRA ' -->
        <div class="feira-submenu" id="submenuFeira">
          <a href="eventos.html" class="submenu-item">
            <span class="submenu-icon">📅</span>
            <span class="submenu-label">Eventos</span>
          </a>
          <a href="loja.html" class="submenu-item">
            <span class="submenu-icon">🛒</span>
            <span class="submenu-label">Loja</span>
          </a>
        </div>
      </div>

      <!-- ' REPORTAR ' -->
      <a href="reportar.html" class="report-button">
        <span class="report-plus">+</span>
        <span class="report-label">Reportar</span>
      </a>

      <!-- ' COMUNIDADE ' -->
      <a href="comunidade.html" class="nav-item">
        <span class="nav-icon">♧</span>
        <span class="nav-label">Comunidade</span>
      </a>

      <!-- ' PERFIL ' -->
      <a href="perfil.html" class="nav-item">
        <span class="nav-icon">♙</span>
        <span class="nav-label">Perfil</span>
      </a>

    </nav>

  </div>

  <!-- ' SCRIPTS ' -->
  
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
  <script src="js/dados.js"></script>
  <script type="module" src="js/moedasService.js"></script>
  <script type="module" src="js/ias.js"></script>
  <script type="module" src="js/mapa/mainMapa.js"></script>

</body>

</html>
