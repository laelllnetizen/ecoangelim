<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | EcoAngelim</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <!-- HEADER -->
  <header>
    <div class="logo">
      <img src="img/logo.png" alt="Logo EcoAngelim">
      <h1>EcoAngelim</h1>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="login-container">
    <div class="login-box">
      <div class="abas">
        <button id="btnLogin" class="ativo">Entrar</button>
        <button id="btnCadastro">Cadastrar</button>
      </div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="loginForm">
        <h2>Entrar</h2>
        
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>

        <button type="submit">Entrar</button>
      </form>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form id="cadastroForm" style="display:none;">
        <h2>Criar Conta</h2>

        <label for="cad-nome">Nome</label>
        <input type="text" id="cad-nome" placeholder="Nome completo" required>

        <label for="cad-email">E-mail</label>
        <input type="email" id="cad-email" placeholder="Seu e-mail" required>

        <label for="cad-senha">Senha</label>
        <input type="password" id="cad-senha" placeholder="Crie uma senha" required>

        <label for="cad-confirmar-senha">Confirmar senha</label>
        <input type="password" id="cad-confirmar-senha" placeholder="Repita a senha" required>

        <button type="submit">Criar Conta</button>
      </form>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    EcoAngelim © 2026
  </footer>

  <!-- SCRIPTS -->
  <script type="module" src="js/login.js"></script>

</body>
</html>
