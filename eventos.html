<!DOCTYPE html>
<html lang="pt-BR">

<script type="module">
    import { auth } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        console.log("Usuário autenticado:", user.email);
      }
    });
</script>
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos | EcoAngelim</title>
  <link rel="stylesheet" href="css/eventos.css">
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <a href="index.html" class="btn-voltar" aria-label="Voltar">←</a>

      <h1>Eventos</h1>

      <!-- CHAVES EXCLUSIVAS DE EVENTOS -->
      <div class="saldo" aria-label="Saldo de Chaves do Sorteio">
        <span>🔑</span>
        <strong id="saldo-chaves">0</strong>
      </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="conteudo">
      <div class="label-secao">ATIVIDADES</div>

      <!-- MUTIRÃO -->
      <article class="evento-card evento-mutirao" data-evento="mutirao">
        <div class="evento-icone">🌱</div>
        <div class="evento-info">
          <h2>Mutirão Verde</h2>
          <p>Participe da ação coletiva.</p>
        </div>
        <span class="evento-dot" data-dot="mutirao"></span>
        <span class="evento-seta">›</span>
      </article>

      <!-- DESAFIO -->
      <article class="evento-card evento-desafio" data-evento="desafio">
        <div class="evento-icone">♻️</div>
        <div class="evento-info">
          <h2>Desafio Verde</h2>
          <p>Transforme registros em chaves.</p>
        </div>
        <span class="evento-dot" data-dot="desafio"></span>
        <span class="evento-seta">›</span>
      </article>

      <!-- PASSE -->
      <article class="evento-card evento-passe" data-evento="passe">
        <div class="evento-icone">🎟️</div>
        <div class="evento-info">
          <h2>Passe EcoAngelim</h2>
          <p>Avance com suas ações verdes.</p>
        </div>
        <span class="evento-dot" data-dot="passe"></span>
        <span class="evento-seta">›</span>
      </article>

      <!-- SORTEIO -->
      <article class="evento-card evento-sorteio" data-evento="sorteio">
        <div class="evento-icone">🎁</div>
        <div class="evento-info">
          <h2>Sorteio</h2>
          <p>Troque chaves por recompensas.</p>
        </div>
        <span class="evento-dot" data-dot="sorteio"></span>
        <span class="evento-seta">›</span>
      </article>
    </main>

    <!-- MODAL -->
    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-overlay"></div>

      <section class="modal-conteudo">
        <button id="fechar-modal" class="fechar-modal" aria-label="Fechar">×</button>
        <div id="detalhe-evento"></div>
      </section>
    </div>

  </div>

  <script type="module" src="js/eventos.js"></script>
</body>
</html>
