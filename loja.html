<!DOCTYPE html>
<html lang="pt-BR">

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        console.log("Usuário autenticado:", user.email);
      }
    });
  </script>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loja | EcoAngelim</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/loja.css">
</head>

<body>

  <!-- ' ESTRUTURA PRINCIPAL DA LOJA ' -->
  <div class="loja">

    <!-- ' HEADER ' -->
    <header class="loja-header">
      <!-- ' BOTÃO VOLTAR ' -->
      <a href="index.html" class="voltar" aria-label="Voltar para o mapa">
        ←
      </a>

      <!-- ' TÍTULO DA PÁGINA ' -->
      <div class="loja-titulo">
        <h1>Loja</h1>
      </div>

      <!-- ' SALDO DE ECOCOINS ' -->
      <div class="loja-saldo" aria-label="Saldo de EcoCoins">
        <span aria-hidden="true">🪙</span>
        <strong id="saldo-ecocoins">--</strong>
      </div>
    </header>

    <!-- ' CONTEÚDO PRINCIPAL ' -->
    <main class="loja-conteudo">
      <!-- ' INTRODUÇÃO DA LOJA ' -->
      <section class="loja-intro">
        <span class="eyebrow">ECOANGELIM</span>
        <p>
          Troque seus EcoCoins por recompensas e apoie o comércio local.
        </p>
      </section>

      <!-- ' LISTA DE ESTABELECIMENTOS / PRODUTOS (RENDERIZADO VIA JS) ' -->
      <div id="lista-lojinhas" aria-live="polite"></div>
    </main>

  </div>

  <!-- ' SCRIPTS ' -->
  <script type="module" src="./js/loja/main.js"></script>

</body>

</html>
